# ====================================================================
# Apache Security Headers Configuration
# Đường dẫn trên Ubuntu: /etc/apache2/conf-available/security_headers.conf
# Kích hoạt: sudo a2enconf security_headers && sudo systemctl reload apache2
# ====================================================================

<IfModule mod_headers.c>
    # 1. Chống Clickjacking - Chỉ cho phép nhúng iframe từ cùng một domain
    Header always set X-Frame-Options "SAMEORIGIN"

    # 2. Ngăn chặn trình duyệt đoán sai MIME-type (MIME Sniffing)
    Header always set X-Content-Type-Options "nosniff"

    # 3. Bật bộ lọc XSS tích hợp sẵn trên các trình duyệt cũ
    Header always set X-XSS-Protection "1; mode=block"

    # 4. Kiểm soát chính sách Referrer để bảo vệ thông tin đường dẫn người dùng
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # 5. Quyền hạn thiết bị (Permissions-Policy) - Tắt các API nguy hiểm khi không dùng
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # 6. Content Security Policy (CSP) cơ bản cho ứng dụng PHP
    Header always set Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src 'self' data: https:;"
</IfModule>
