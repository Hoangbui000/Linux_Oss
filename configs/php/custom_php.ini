; ====================================================================
; PHP Custom Settings for LAMP Stack
; Đường dẫn: /etc/php/<version>/apache2/conf.d/99-custom.ini
; Áp dụng: sudo systemctl reload apache2
; ====================================================================

[PHP]
; 1. Quản lý tài nguyên và giới hạn bộ nhớ
memory_limit = 256M
max_execution_time = 120
max_input_time = 60

; 2. Giới hạn dung lượng tải file lên (Upload file)
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; 3. Bảo mật: Ẩn thông tin phiên bản PHP trên HTTP Header
expose_php = Off

; 4. Quản lý hiển thị lỗi (Môi trường Production/Demo)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = /var/log/apache2/php_errors.log

; 5. Thiết lập Múi giờ Việt Nam
date.timezone = Asia/Ho_Chi_Minh

; 6. Tối ưu OPcache (Tăng tốc xử lý PHP script từ 2-3 lần)
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.save_comments = 1
