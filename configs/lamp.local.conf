# ====================================================================
# File Cấu Hình Apache Virtual Host Mẫu Cho Đồ Án LAMP Stack
# Đường dẫn trên Ubuntu: /etc/apache2/sites-available/lamp.local.conf
# ====================================================================

# Cấu hình HTTP (Port 80) - Tự động chuyển hướng sang HTTPS
<VirtualHost *:80>
    ServerAdmin webmaster@lamp.local
    ServerName lamp.local
    ServerAlias www.lamp.local

    DocumentRoot /var/www/lamp.local/public_html

    <Directory /var/www/lamp.local/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Chuyển hướng toàn bộ traffic sang HTTPS (Kích hoạt sau khi cài SSL)
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/lamp_local_error.log
    CustomLog ${APACHE_LOG_DIR}/lamp_local_access.log combined
</VirtualHost>

# Cấu hình HTTPS (Port 443) - Kích hoạt sau khi có chứng chỉ SSL
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin webmaster@lamp.local
    ServerName lamp.local
    ServerAlias www.lamp.local

    DocumentRoot /var/www/lamp.local/public_html

    <Directory /var/www/lamp.local/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Đường dẫn chứng chỉ SSL (Let's Encrypt hoặc Self-signed)
    # SSLEngine on
    # SSLCertificateFile /etc/ssl/certs/lamp_selfsigned.crt
    # SSLCertificateKeyFile /etc/ssl/private/lamp_selfsigned.key

    # Tối ưu bảo mật Header
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog ${APACHE_LOG_DIR}/lamp_local_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/lamp_local_ssl_access.log combined
</VirtualHost>
</IfModule>
